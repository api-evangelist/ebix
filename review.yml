actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    apis[] is intentionally empty. Ebix publishes no public, self-serve,
    documented API and no retrievable machine-readable specification. Listing an
    API here would require inventing a documentation URL that does not exist.
    Recording the gate accurately — a live but 401-protected OpenAPI on the
    EbixCash API Hub, a soft-404 SPA where a developer portal would be, and a
    deep ACORD AL3/XML + IVANS transport where an API would be — is the correct
    outcome for a United States insurance infrastructure vendor operating with no
    federal regulator and no open-insurance mandate.
