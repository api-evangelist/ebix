name: Ebix
kind: company
description: >-
  Ebix is a United States insurance software and exchange company headquartered
  in Johns Creek, Georgia, operating as market infrastructure between carriers,
  MGAs, brokers and agencies rather than as a carrier itself. Its portfolio spans
  property and casualty agency management (EbixASP), P&C policy administration
  and broker systems (EbixEvolution, PlacingHub, Sunrise Exchange, iClose), life
  insurance and annuity distribution connectivity (EbixExchange), health
  insurance and employee benefits administration, health content, risk and
  compliance (RiskEnvision, WCExchange), and — through the EbixCash arm — travel,
  payments and forex services. Its core P&C plumbing is ACORD-native rather than
  API-native: TEAM-UP moves policy, claims and direct-bill commission download to
  agency management systems as ACORD-standard AL3 files, its Translation Services
  practice converts carrier-proprietary formats into ACORD AL3 and ACORD XML
  using Java/XML/XSLT, EbixASP maintains a continuously updated ACORD forms
  library with bi-directional exchange against ACORD applications, and the
  EbixASP Real-Time Interface synchronizes carrier credentials and service
  transactions with IVANS. Ebix markets API-driven quote-to-bind workflows and,
  since October 2025, a plug-and-play connector platform built with 1SilverBullet
  that exposes quoting, eApp, enrollment, underwriting checks, payments and
  policy servicing as modular APIs with "a standardized connector fabric with
  pre-built mappings and a developer portal" — but no public self-serve developer
  portal, API reference or machine-readable specification could be confirmed as
  of 2026-07-25. Every probed developer path on ebix.com (/developers, /api,
  /developer, /partners, /integrations) returns the site's single-page-app
  homepage shell rather than a developer surface; developer.ebix.com and
  docs.ebix.com do not resolve; api.ebix.com answers with a JSON 404 and no
  documented routes; and the live EbixCash API Hub at api.ebixcash.com serves an
  OpenAPI document that returns HTTP 401 "Missing Authorization header". The one
  agent-facing discovery document Ebix does publish is a real llms.txt at
  www.ebix.com/llms.txt, which indexes the solution, service and corporate pages
  but names no API, portal or specification; every /.well-known/ probe across
  www.ebix.com, api.ebix.com, api.ebixcash.com and ebixasp.com missed, no
  first-party SDK exists in any public package registry, and no trust center,
  security.txt or vulnerability-disclosure program was found. Ebix's
  integration surface is therefore customer- and partner-gated, sold and
  documented under contract, which is the norm for United States insurance
  infrastructure where no federal regulator and no open-insurance mandate exists.
  Ebix filed Chapter 11 in December 2023, sold its North American life and
  annuity assets to Zinnia, and exited bankruptcy on 30 August 2024 consolidated
  with Eraaya Lifespaces.
